<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise Buat Kamu!</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #fdf5e6; overflow: hidden; }
        #intro-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffb6c1; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        #intro-screen h1 { color: #fff; margin-bottom: 20px; font-family: sans-serif; }
        #start-btn { padding: 15px 40px; font-size: 18px; font-weight: bold; color: #ffb6c1; background-color: #fff; border: none; border-radius: 30px; cursor: pointer; }
        .swiper { width: 100%; height: 100%; display: none; }
        .swiper-slide { display: flex; justify-content: center; align-items: center; }
        .swiper-slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .swiper-pagination-bullet-active { background-color: #ff69b4 !important; }
    </style>
</head>
<body>
    <div id="intro-screen">
        <h1>Ada kado spesial nih...</h1>
        <button id="start-btn">Buka Kado 🎁</button>
    </div>

    <audio id="bgm" loop>
        <source src="song" type="audio/mp3">
    </audio>

    <div class="swiper mySwiper" id="comic-area">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="cover.png" alt="Cover"></div>
            <div class="swiper-slide"><img src="page1.png" alt="Halaman 1"></div>
            <div class="swiper-slide"><img src="page2.png" alt="Halaman 2"></div>
            <div class="swiper-slide"><img src="page3.png" alt="Halaman 3"></div>
            <div class="swiper-slide"><img src="page4.png" alt="Halaman 4"></div>
            <div class="swiper-slide"><img src="page5.png" alt="Halaman 5"></div>
            <div class="swiper-slide"><img src="page6.png" alt="Halaman 6"></div>
            <div class="swiper-slide"><img src="page7.png" alt="Halaman 7"></div>
            <div class="swiper-slide"><img src="page8.png" alt="Halaman 8"></div>
            <div class="swiper-slide"><img src="page9.png" alt="Halaman 9"></div>
            <div class="swiper-slide"><img src="page10.png" alt="Halaman 10"></div>
        </div>
        <div class="swiper-pagination"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.getElementById('start-btn').addEventListener('click', function() {
            document.getElementById('bgm').play();
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('comic-area').style.display = 'block';
            new Swiper(".mySwiper", { pagination: { el: ".swiper-pagination", clickable: true } });
        });
    </script>
</body>
</html>
